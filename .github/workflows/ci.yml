name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # dev extras + cryptography so the Kalshi RSA-signer test runs (not skipped).
        # Heavier .[live] SDKs (py-clob-client, kalshi sdk) are not needed for tests.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cryptography

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest
        run: pytest -q
