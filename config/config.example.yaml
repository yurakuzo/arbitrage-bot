# Non-secret tuning. Copy to config/config.yaml to override (config.yaml is gitignored).
# Secrets live in .env, never here.

thresholds:
  # Minimum fee-net edge (in dollars per contract) required to flag an opportunity.
  min_edge: 0.01
  # Quotes older than this (ms) are treated as stale -> anomaly, never traded on.
  # Must exceed feed cadence (Kalshi polls ~3s, WS re-emits ~2s).
  max_quote_age_ms: 8000
  # Per-opportunity paper stake cap (USD).
  max_stake_usd: 100.0

venues:
  - kalshi
  - polymarket

# Live execution (Phase 4). Defaults are the safest possible.
execution:
  # paper: simulate only (no real orders — the safe default).
  # semi_auto: propose each trade via Telegram; place only on an explicit "yes".
  # auto: place both legs immediately (highest risk).
  # NOTE: even semi_auto/auto place NOTHING unless the trading gate is fully open
  # (ARB_LIVE_TRADING=true AND ARB_ENVIRONMENT=prod). See docs/PROJECT.md.
  mode: paper
  confirm_timeout_s: 120      # semi_auto: seconds to wait for a Telegram yes/no
  max_order_stake_usd: 50.0   # hard per-order cap on real capital

# How analysis mode finds candidate markets per venue.
discovery:
  kalshi:
    # Kalshi's flat /markets listing is >90% auto-generated sports parlays, so we
    # sweep the /events stream instead — diverse, real markets across econ/
    # politics/crypto/world/etc. `max_markets` caps how many candidates we pull;
    # `arb collect --limit N` then snapshots the top N by volume.
    max_markets: 2000
    # PINNED series are ALWAYS snapshotted (they bypass the volume ranking), so
    # low-volume-but-fast daily markets don't get crowded out. Good picks:
    series:
      # Daily crypto (pairable with Polymarket's short-dated BTC/ETH markets):
      - KXBTCD          # Bitcoin price above/below (daily)
      - KXETH           # Ethereum range
      # Daily US-city weather (Kalshi-only — Polymarket has none, so no arb;
      # collected for analysis / a future 3rd venue). No London on Kalshi.
      - KXHIGHNY        # NYC high temp
      - KXHIGHLAX       # LA high temp
      - KXHIGHCHI       # Chicago high temp
      - KXHIGHTHOU      # Houston high temp
      - KXHIGHTMIN      # Minneapolis high temp
    per_series_limit: 200
  polymarket:
    # Volume-sorted + paginated: `arb collect --limit N` fetches top N by volume
    # across all of Polymarket. No bulk sweep needed.
    series: []
    max_markets: 0
    per_series_limit: 100
