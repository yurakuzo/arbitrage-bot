[project]
name = "arbitrage-bot"
version = "0.1.0"
description = "Cross-venue arbitrage bot for Polymarket and Kalshi (analysis + paper-trading)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Venue trading SDKs — only needed for Phase 4 (live execution). Kept optional so v1
# (detection + paper-trading) installs lean and works with public read-only endpoints.
live = [
    "cryptography>=42.0",   # Kalshi RSA-PSS request signing
    "kalshi-python-sync>=1.0",
    "py-clob-client>=0.1",  # Polymarket EIP-712 order signing + CLOB client
]

[project.scripts]
arb = "arb.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
